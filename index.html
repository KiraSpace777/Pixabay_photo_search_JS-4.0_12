<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://pixabay.com/ru/images/download/energytoexplore-px-7147218_1920.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixabay photo</title>
    <script type="module" crossorigin src="/Pixabay_photo_search_JS-4.0_12/index.js"></script>
    <link rel="modulepreload" crossorigin href="/Pixabay_photo_search_JS-4.0_12/assets/vendor-BAQQTdrx.js">
    <link rel="stylesheet" crossorigin href="/Pixabay_photo_search_JS-4.0_12/assets/vendor-CWKLx11g.css">
    <link rel="stylesheet" crossorigin href="/Pixabay_photo_search_JS-4.0_12/assets/index-DwWd1v_r.css">
  </head>
  <body>
    <header></header>
    <main>
      <form class="form">
        <label class="form-label">
          <p class="label-text">Choose the photo</p>
          <input
            class="input-field"
            type="text"
            name="query"
            autocomplete="off"
            placeholder="Search images..."
          />
        </label>
        <button class="submit-btn" type="submit">Search</button>
      </form>

      <!-- Element for the SimpleLightbox modal (gallery, large image) -->
      <ul class="gallery"></ul>

     <!-- Load-more button (initially hidden via the is-hidden class) -->
      <button type="button" class="load-more submit-btn is-hidden">
        Load more
      </button>

      <p class="images-counter is-hidden"></p>

      <div class="loader-overlay">
        <span class="loader"></span>
      </div>

      <button
        type="button"
        class="back-to-top is-hidden"
        id="backToTop"
        title="Go to top"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="3"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m18 15-6-6-6 6" />
        </svg>
      </button>
    </main>

    <footer class="footer">
      <div class="container">
        <p class="footer-desc">
          Made with ✨ by <b>Anna K.</b> (images provided by
          <a href="https://pixabay.com">"Pixabay"</a>)
        </p>
      </div>
    </footer>

  </body>
</html>
